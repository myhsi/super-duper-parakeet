<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Course Schedule</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --regular-badge: #dbeafe;
      --regular-text: #1e40af;
      --spec-badge: #fef3c7;
      --spec-text: #92400e;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text-dark);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    input[type="text"] {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.875rem;
      min-width: 200px;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .schedule-grid {
        grid-template-columns: 1fr;
      }
    }

    .day-column {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
    }

    .day-header {
      background: #e2e8f0;
      padding: 10px;
      font-weight: 700;
      text-align: center;
      font-size: 0.95rem;
    }

    .time-slot {
      border-top: 1px solid var(--border-color);
      padding: 10px;
      background: var(--card-bg);
      margin-top: 4px;
    }

    .time-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .course-card {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      border-left: 4px solid var(--primary);
      background: #f1f5f9;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .course-card:hover {
      transform: translateY(-2px);
    }

    .course-code {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .course-title {
      font-size: 0.75rem;
      color: var(--text-dark);
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-top: 4px;
    }

    .badge-regular {
      background: var(--regular-badge);
      color: var(--regular-text);
    }

    .badge-spec {
      background: var(--spec-badge);
      color: var(--spec-text);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 12px;
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Interactive Weekly Schedule</h1>

  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="filterSession('All', this)">All Sessions</button>
      <button class="filter-btn" onclick="filterSession('Regular', this)">Regular</button>
      <button class="filter-btn" onclick="filterSession('Spec Sess', this)">Special Session</button>
    </div>
    <input type="text" id="searchInput" placeholder="Search course or code..." onkeyup="renderSchedule()">
  </div>

  <div class="schedule-grid" id="scheduleGrid"></div>
</div>

<!-- Modal -->
<div class="modal" id="courseModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2 id="modalCode" style="margin-bottom: 8px;"></h2>
    <p id="modalTitle" style="color: var(--text-muted); margin-bottom: 12px;"></p>
    <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
    <p><strong>Day:</strong> <span id="modalDay"></span></p>
    <p><strong>Session:</strong> <span id="modalSession"></span></p>
    <p><strong>Time:</strong> <span id="modalTime"></span></p>
  </div>
</div>

<script>
const scheduleData = [
  // Monday
  { day: 'Monday', session: 'Regular', time: '9:00 AM - 11:45 AM', code: 'SCWK 212', title: 'Human Behavior in Social Environment I' },
  { day: 'Monday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 220', title: 'Transcultural Generalist Practice I' },
  { day: 'Monday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 251', title: 'Social Work in Health and Aging' },
  { day: 'Monday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 281', title: 'Social Work in Mental Health' },
  { day: 'Monday', session: 'Regular', time: '3:00 PM - 5:45 PM', code: 'SCWK 231', title: 'Social Work Practicum II' },
  { day: 'Monday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 202', title: 'Social Welfare Policy Analysis for Social Work Practice' },
  { day: 'Monday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 220', title: 'Transcultural Generalist Practice I' },
  { day: 'Monday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 298A', title: 'Special Study A' },

  // Tuesday
  { day: 'Tuesday', session: 'Regular', time: '9:00 AM - 11:45 AM', code: 'SCWK 272', title: 'Social Work in Educational Settings' },
  { day: 'Tuesday', session: 'Regular', time: '9:00 AM - 11:45 AM', code: 'SCWK 281', title: 'Social Work in Mental Health' },
  { day: 'Tuesday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 222', title: 'Transcultural Advanced Generalist Practice I: Family Systems Focus' },
  { day: 'Tuesday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 298A', title: 'Special Study A' },
  { day: 'Tuesday', session: 'Regular', time: '3:00 PM - 5:45 PM', code: 'SCWK 298A', title: 'Special Study A' },
  { day: 'Tuesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 200W', title: 'Social Work Graduate Writing Course' },
  { day: 'Tuesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 224', title: 'Advanced Generalist Practice With Spanish Speaking Populations' },
  { day: 'Tuesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 230', title: 'Social Work Practicum I' },
  { day: 'Tuesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 265', title: 'Child Welfare Practice in Public and Government Systems' },
  { day: 'Tuesday', session: 'Spec Sess', time: '6:00 PM - 7:30 PM', code: 'SCWK 263', title: 'Social Work and the Law' },
  { day: 'Tuesday', session: 'Spec Sess', time: '6:30 PM - 8:00 PM', code: 'SCWK 212', title: 'Human Behavior in Social Environment I' },
  { day: 'Tuesday', session: 'Spec Sess', time: '6:30 PM - 8:00 PM', code: 'SCWK 298A', title: 'Special Study A' },
  { day: 'Tuesday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 220', title: 'Transcultural Generalist Practice I' },

  // Wednesday
  { day: 'Wednesday', session: 'Regular', time: '9:00 AM - 11:45 AM', code: 'SCWK 212', title: 'Human Behavior in Social Environment I' },
  { day: 'Wednesday', session: 'Regular', time: '9:00 AM - 11:45 AM', code: 'SCWK 220', title: 'Transcultural Generalist Practice I' },
  { day: 'Wednesday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 212', title: 'Human Behavior in Social Environment I' },
  { day: 'Wednesday', session: 'Regular', time: '12:00 PM - 2:45 PM', code: 'SCWK 220', title: 'Transcultural Generalist Practice I' },
  { day: 'Wednesday', session: 'Regular', time: '3:00 PM - 5:45 PM', code: 'SCWK 230', title: 'Social Work Practicum I' },
  { day: 'Wednesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 212', title: 'Human Behavior in Social Environment I' },
  { day: 'Wednesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 231', title: 'Social Work Practicum II' },
  { day: 'Wednesday', session: 'Regular', time: '6:00 PM - 8:45 PM', code: 'SCWK 260', title: 'Policy Practice in Child and Family Welfare' },
  { day: 'Wednesday', session: 'Spec Sess', time: '5:00 PM - 6:30 PM', code: 'SCWK 230', title: 'Social Work Practicum I' },
  { day: 'Wednesday', session: 'Spec Sess', time: '6:30 PM - 8:00 PM', code: 'SCWK 298A', title: 'Special Study A' },

  // Thursday
  { day: 'Thursday', session: 'Spec Sess', time: '6:30 PM - 7:30 PM', code: 'SCWK 231', title: 'Social Work Practicum II' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 200W', title: 'Social Work Graduate Writing Course' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 222', title: 'Transcultural Advanced Generalist Practice I' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 251', title: 'Social Work in Health and Aging' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 265', title: 'Child Welfare Practice' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 272', title: 'Social Work in Educational Settings' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:00 PM - 9:30 PM', code: 'SCWK 281', title: 'Social Work in Mental Health' },
  { day: 'Thursday', session: 'Spec Sess', time: '8:15 PM - 9:15 PM', code: 'SCWK 230', title: 'Social Work Practicum I' },

  // Friday
  { day: 'Friday', session: 'Regular', time: '9:30 AM - 12:15 PM', code: 'SCWK 200W', title: 'Social Work Graduate Writing Course' },
  { day: 'Friday', session: 'Regular', time: '9:30 AM - 12:15 PM', code: 'SCWK 202', title: 'Social Welfare Policy Analysis' },
  { day: 'Friday', session: 'Regular', time: '12:30 PM - 3:15 PM', code: 'SCWK 200W', title: 'Social Work Graduate Writing Course' },
  { day: 'Friday', session: 'Regular', time: '12:30 PM - 3:15 PM', code: 'SCWK 202', title: 'Social Welfare Policy Analysis' },
  { day: 'Friday', session: 'Spec Sess', time: '6:00 PM - 7:30 PM', code: 'SCWK 231', title: 'Social Work Practicum II' }
];

let activeSessionFilter = 'All';

function filterSession(sessionType, btn) {
  activeSessionFilter = sessionType;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSchedule();
}

function renderSchedule() {
  const searchQuery = document.getElementById('searchInput').value.toLowerCase();
  const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const grid = document.getElementById('scheduleGrid');
  grid.innerHTML = '';

  days.forEach(day => {
    const dayCol = document.createElement('div');
    dayCol.className = 'day-column';

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerText = day;
    dayCol.appendChild(header);

    // Filter courses for this day
    const dayCourses = scheduleData.filter(item => {
      const matchesDay = item.day === day;
      const matchesSession = activeSessionFilter === 'All' || item.session === activeSessionFilter;
      const matchesSearch = item.code.toLowerCase().includes(searchQuery) || item.title.toLowerCase().includes(searchQuery);
      return matchesDay && matchesSession && matchesSearch;
    });

    // Group by time slot
    const timeSlots = {};
    dayCourses.forEach(c => {
      if (!timeSlots[c.time]) timeSlots[c.time] = [];
      timeSlots[c.time].push(c);
    });

    Object.keys(timeSlots).forEach(time => {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'time-slot';

      const timeTitle = document.createElement('div');
      timeTitle.className = 'time-title';
      timeTitle.innerText = time;
      slotDiv.appendChild(timeTitle);

      timeSlots[time].forEach(course => {
        const card = document.createElement('div');
        card.className = 'course-card';
        card.onclick = () => openModal(course);

        const code = document.createElement('div');
        code.className = 'course-code';
        code.innerText = course.code;

        const title = document.createElement('div');
        title.className = 'course-title';
        title.innerText = course.title;

        const badge = document.createElement('span');
        badge.className = `badge ${course.session === 'Regular' ? 'badge-regular' : 'badge-spec'}`;
        badge.innerText = course.session;

        card.appendChild(code);
        card.appendChild(title);
        card.appendChild(badge);
        slotDiv.appendChild(card);
      });

      dayCol.appendChild(slotDiv);
    });

    grid.appendChild(dayCol);
  });
}

function openModal(course) {
  document.getElementById('modalCode').innerText = course.code;
  document.getElementById('modalTitle').innerText = course.title;
  document.getElementById('modalDay').innerText = course.day;
  document.getElementById('modalSession').innerText = course.session;
  document.getElementById('modalTime').innerText = course.time;
  document.getElementById('courseModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('courseModal').style.display = 'none';
}

// Initial Render
renderSchedule();
</script>

</body>
</html>
